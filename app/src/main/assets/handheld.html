<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Check pallets and cartons on the Keypharm RFID handheld.">
<title>Keypharm RFID POC</title><link rel="stylesheet" href="style.css"><script type="module" src="handheld.mjs"></script></head>
<body class="handheld"><header class="mast"><div class="mast-inner"><span class="brand"><img src="keypharm-logo-hd.png" alt="KeyPharm Laboratories" width="681" height="150"></span><div id="who"></div><div id="workspace-header-actions" hidden></div></div></header>
<main class="shell"><p id="notice" class="info-bubble" role="status"></p><section id="workspace-connection" hidden></section><div id="app"><p>Opening local records…</p></div>
<dialog id="workflow-confirmation" class="workflow-dialog" aria-labelledby="workflow-title" aria-describedby="workflow-detail">
  <span class="workflow-tick" aria-hidden="true"></span><h2 id="workflow-title"></h2><p id="workflow-detail"></p>
  <div id="workflow-tags"></div><button type="button" id="workflow-dismiss">Done</button>
</dialog>
<noscript><p>Enable JavaScript to use the handheld workflow.</p></noscript></main></body></html>
